# Yalnızca geliştirici içindir (yeni göç üretmek):
#   set DATABASE_URL=sqlite:///data/gelistirme.db
#   alembic upgrade head
#   alembic revision --autogenerate -m "aciklama"
# Uygulama göçleri kendisi çalıştırır (SqlAlchemyJobStore.migrate()); bu dosya gerekmez.
[alembic]
script_location = src/live_stream/infrastructure/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
