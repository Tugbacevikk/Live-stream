[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live-stream"
version = "0.1.0"
description = "Konuşurken sesi anında metne dönüştüren canlı altyazı uygulaması (Faster-Whisper + Silero VAD)"
authors = [{ name = "Tuğba Çevik" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.24",
    "soundfile>=0.12",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
live-stream = "live_stream.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live_stream = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
