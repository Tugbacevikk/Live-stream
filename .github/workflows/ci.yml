# Her push ve PR'da: katman kuralları, birim testleri, depo testleri (SQLite + PostgreSQL),
# Redis Streams testleri. Modeller indirilmez (entegrasyon testleri kendiliğinden atlanır);
# hız/kabul testi gerçek donanımda elle: benchmarks/kabul_testi.py
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asr_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[server,dev]" pyflakes
      - run: python -m pyflakes src tests scripts benchmarks
      - run: lint-imports
      - run: pytest -q tests/unit tests/db
      - name: Şema göçleri modellerle aynı mı
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: sqlite:///ci.db

  windows:
    # Asıl çalışma ortamı Windows: yerel mod (SQLite + iş parçacıkları) burada da sınansın
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[server,dev]"
      - run: pytest -q tests/unit tests/db
