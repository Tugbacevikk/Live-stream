# Tüm sistem:  docker compose up -d --build
# Önce modeller: python scripts/download_models.py  (./models klasörüne)
#
# Çekirdek bütçesi: her worker süreci ONNX_THREADS çekirdek kullanır.
# worker-vi süreç sayısını kendisi hesaplar: kullanılabilir çekirdek / ONNX_THREADS
# (konteynere "cpus:" sınırı konduysa onu dikkate alır). worker-lid ve worker-tr
# 1 süreçle başlar; Türkçe yük artarsa CONCURRENCY değerini yükseltin. Toplam
# süreç x ONNX_THREADS çekirdek sayısını geçerse süreçler birbirini yavaşlatır.

x-app: &app
  build: .
  image: live-stream:0.4.0
  restart: unless-stopped
  env_file: [{path: .env, required: false}]
  environment: &env
    APP_ENV: production
    API_KEY: ${API_KEY:?API_KEY .env içinde tanımlanmalı}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    DATABASE_URL: postgresql://asr:asr@postgres:5432/asr
    REDIS_URL: redis://redis:6379/0
    LANGUAGES: tr
    WHISPER_DEVICE: cpu          # sunucu: yalnızca CPU
    TR_MODEL: ${TR_MODEL:-faster-whisper-medium}
    ONNX_THREADS: "2"
    NUM_SPEAKERS: "0"            # 0: sesten bul; istekte num_speakers verilebilir
    DIARIZER: cluster
    TASK_TIME_LIMIT: "1800"      # tek iş en fazla 30 dk
  volumes:
    - ./models:/models:ro
    - uploads:/data/uploads
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: asr, POSTGRES_PASSWORD: asr, POSTGRES_DB: asr}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asr"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # kuyruk yeniden başlatmada kaybolmasın
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    ports: ["8000:8000"]
    environment:
      <<: *env
      MAX_UPLOAD_MB: "100"
    healthcheck:       # canlılık; hazır olma (modeller + işçiler) için /health/ready
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  worker-tr:           # Türkçe: faster-whisper medium ~1,8 GB/süreç; sayı bellek ve çekirdekten
    <<: *app
    command: ["python", "-m", "live_stream.interface.stream_worker", "--kuyruk", "tr"]
    environment:
      <<: *env
      CONCURRENCY: auto

  dispatcher:          # outbox -> webhook (WEBHOOK_SECRET varsa imzalı)
    <<: *app
    command: ["python", "-m", "live_stream.interface.dispatcher"]

  bakim:               # saklama süreleri, askıda/kuyruğa girememiş işler (Redis kilidiyle tek kopya)
    <<: *app
    command: ["python", "-m", "live_stream.interface.bakim"]

volumes:
  pgdata:
  redisdata:
  uploads:
